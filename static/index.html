<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MortakizAi | مَرْتَكَز</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="min-h-screen flex">
    <div class="bg-accent-glow"></div>
    
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar__header">
            <button id="newChatBtn" class="new-chat-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span id="newChatText">محادثة جديدة</span>
            </button>
        </div>
        <div class="sidebar__content">
            <p id="chatsLabel" class="sidebar__label">المحادثات السابقة</p>
            <div id="chatsList" class="chats-list"></div>
        </div>
        <div class="sidebar__footer">
            <button id="clearAllChatsBtn" class="toggle-sidebar-btn clear-all-btn" title="حذف جميع المحادثات">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
            </button>
            <button id="toggleSidebarBtn" class="toggle-sidebar-btn" title="إخفاء القائمة">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 19l-7-7 7-7M18 19l-7-7 7-7"/>
                </svg>
            </button>
        </div>
    </aside>
    
    <!-- Main Content -->
    <div class="main-wrapper flex-grow flex flex-col">
    <header class="shadow-md">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between max-w-5xl gap-4">
            <div class="flex items-center gap-3">
                <div>
                    <p id="subtitleText" class="text-xs sm:text-sm text-slate-400">مساعد البرمجة المحلي</p>
                    <p id="titleText" class="text-xl font-semibold text-sky-400">مَرْتَكَز - MortakizAi</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="openSidebarBtn" class="sidebar-toggle-btn hidden" aria-label="فتح القائمة" title="فتح القائمة">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12h18M3 6h18M3 18h18"/>
                    </svg>
                </button>
                <button id="langToggle" class="lang-toggle" aria-label="تغيير اللغة">EN</button>
                <span id="statusText" class="status-badge">متصل محلياً</span>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 max-w-4xl w-full flex flex-col">
        <!-- Hero Section - يظهر في البداية فقط -->
        <section id="hero" class="hero hero--centered">
            <p id="heroTitle" class="hero__title">ما الذي تريد البدء به؟</p>
            <div id="heroInputInitial" class="hero__input">
                <button class="icon-btn" aria-hidden="true" id="uploadBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                </button>
                <div id="attachments" class="inline-attachments hidden"></div>
                <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." class="input-field" autocomplete="off">
                <div class="hero__actions">
                    <button id="sendBtn" class="send-circle" aria-label="إرسال" title="إرسال">
                        <svg class="icon-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 11 18-8-8 18-2-7-8-3Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Chat Section - يظهر بعد الإرسال -->
        <section id="chatPanel" class="chat-panel hidden">
            <div id="chatBox" class="chat-container"></div>
            <div class="chat-input-wrapper">
                <div class="chat-input-bar">
                    <button class="icon-btn" aria-hidden="true" id="uploadBtnChat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                    </button>
                    <div id="chatAttachments" class="inline-attachments hidden"></div>
                    <input type="text" id="userInputChat" placeholder="اكتب سؤالك هنا..." class="input-field" autocomplete="off">
                    <button id="sendBtnChat" class="send-circle" aria-label="إرسال" title="إرسال">
                        <svg class="icon-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 11 18-8-8 18-2-7-8-3Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const chatBox = document.getElementById('chatBox');
        const hero = document.getElementById('hero');
        const chatPanel = document.getElementById('chatPanel');
        const langToggle = document.getElementById('langToggle');
        const titleText = document.getElementById('titleText');
        const subtitleText = document.getElementById('subtitleText');
        const statusText = document.getElementById('statusText');
        
        // Sidebar elements
        const sidebar = document.getElementById('sidebar');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatsList = document.getElementById('chatsList');
        const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
        const openSidebarBtn = document.getElementById('openSidebarBtn');
        const clearAllChatsBtn = document.getElementById('clearAllChatsBtn');
        const newChatText = document.getElementById('newChatText');
        const chatsLabel = document.getElementById('chatsLabel');
        
        // Hero inputs (initial state)
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        
        // Chat inputs (after first message)
        const userInputChat = document.getElementById('userInputChat');
        const sendBtnChat = document.getElementById('sendBtnChat');
        const uploadBtnChat = document.getElementById('uploadBtnChat');
        
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.multiple = true;
        fileInput.accept = '.txt,.md,.py,.js,.ts,.json,.yaml,.yml,.html,.css,.cpp,.c,.h,.java,.cs,.go,.rs,.php,.rb,.sh,.ps1,.sql,.xml,.docx';

        const translations = {
            ar: {
                dir: 'rtl',
                lang: 'ar',
                title: 'مَرْتَكَز - MortakizAi',
                subtitle: 'مساعد البرمجة المحلي',
                status: 'متصل محلياً',
                panelTitle: 'المحادثة',
                panelSubtitle: 'اسأل عن الأكواد، التصحيحات، أو الاقتراحات',
                placeholder: 'اكتب سؤالك هنا...',
                send: 'إرسال',
                welcome: 'أهلاً بك! أنا "مَرْتَكَز"، ذكاؤك الاصطناعي المحلي. كيف يمكنني مساعدتك في الكود اليوم؟',
                error: '⚠️ خطأ في الاتصال بالسيرفر.',
                toggleLabel: 'EN',
                copy: 'نسخ',
                copied: 'تم النسخ',
                newChat: 'محادثة جديدة',
                prevChats: 'المحادثات السابقة',
                noChats: 'لا توجد محادثات سابقة'
            },
            en: {
                dir: 'ltr',
                lang: 'en',
                title: 'MortakizAi',
                subtitle: 'Local coding copilot',
                status: 'Local connection',
                panelTitle: 'Chat',
                panelSubtitle: 'Ask for code, fixes, or suggestions',
                placeholder: 'Type your question...',
                send: 'Send',
                welcome: 'Hi there! I\'m "Mortakiz", your local AI. How can I help with code today?',
                error: '⚠️ Connection error with server.',
                toggleLabel: 'عربي',
                copy: 'Copy',
                copied: 'Copied',
                newChat: 'New Chat',
                prevChats: 'Previous Chats',
                noChats: 'No previous chats'
            }
        };

        let currentLang = 'ar';
        let conversationStarted = false;
        let attachments = [];
        let currentConversationId = null;
        let conversations = [];
        const SIDEBAR_KEY = 'mortakiz-sidebar';

        function escapeHTML(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatMarkdown(text) {
            // Bold: **text** or __text__
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
            // Italic: *text* or _text_
            text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            text = text.replace(/_([^_]+)_/g, '<em>$1</em>');
            // Inline code: `code`
            text = text.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
            // Line breaks
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        function renderContent(raw, el) {
            const parts = raw.split(/```/);
            let html = '';

            parts.forEach((part, idx) => {
                if (idx % 2 === 0) {
                    const escaped = escapeHTML(part);
                    const formatted = formatMarkdown(escaped);
                    if (formatted.trim().length) html += `<div class="msg-text">${formatted}</div>`;
                } else {
                    const code = part.trim();
                    html += `
                        <div class="code-block">
                            <button class="copy-btn" data-copy>${translations[currentLang].copy}</button>
                            <pre><code>${escapeHTML(code)}</code></pre>
                        </div>
                    `;
                }
            });

            el.innerHTML = html || '<div class="msg-text">…</div>';

            el.querySelectorAll('[data-copy]').forEach(btn => {
                btn.onclick = () => {
                    const codeEl = btn.nextElementSibling?.querySelector('code');
                    if (!codeEl) return;
                    navigator.clipboard.writeText(codeEl.textContent).then(() => {
                        const original = btn.textContent;
                        btn.textContent = translations[currentLang].copied;
                        setTimeout(() => (btn.textContent = translations[currentLang].copy), 1200);
                    });
                };
            });
        }
        function addMessage(text, isAi) {
            const div = document.createElement('div');
            div.className = `message ${isAi ? 'ai-msg' : 'user-msg'}`;
            renderContent(text, div);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            updateHeroState();
            return div;
        }

        function updateHeroState() {
            // Not needed anymore
        }

        function revealChat() {
            hero.classList.add('hidden');
            chatPanel.classList.remove('hidden');
            userInputChat.focus();
        }
        
        function showHero() {
            hero.classList.remove('hidden');
            chatPanel.classList.add('hidden');
            chatBox.innerHTML = '';
            userInput.focus();
        }
        
        // Sidebar functions
        function toggleSidebar(show) {
            const isOpen = show !== undefined ? show : sidebar.classList.contains('sidebar--collapsed');
            sidebar.classList.toggle('sidebar--collapsed', !isOpen);
            openSidebarBtn.classList.toggle('hidden', isOpen);
            localStorage.setItem(SIDEBAR_KEY, isOpen ? 'open' : 'closed');
        }
        
        (function initSidebar() {
            const saved = localStorage.getItem(SIDEBAR_KEY);
            if (saved === 'closed') {
                toggleSidebar(false);
            }
        })();
        
        toggleSidebarBtn.addEventListener('click', () => toggleSidebar(false));
        openSidebarBtn.addEventListener('click', () => toggleSidebar(true));
        
        async function loadConversations() {
            try {
                const res = await fetch('/v1/conversations');
                if (!res.ok) return;
                const data = await res.json();
                conversations = data.conversations || [];
                renderConversationsList();
            } catch (e) {
                // ignore
            }
        }
        
        function renderConversationsList() {
            chatsList.innerHTML = '';
            if (conversations.length === 0) {
                chatsList.innerHTML = `<p class="no-chats">${translations[currentLang].noChats}</p>`;
                return;
            }
            conversations.forEach(conv => {
                const item = document.createElement('button');
                item.className = `chat-item ${conv.id === currentConversationId ? 'chat-item--active' : ''}`;
                item.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span class="chat-item__title">${conv.title || 'محادثة'}</span>
                    <button class="chat-item__delete" data-conv-id="${conv.id}" title="حذف">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                `;
                item.addEventListener('click', (e) => {
                    if (!e.target.closest('.chat-item__delete')) {
                        loadConversation(conv.id);
                    }
                });
                chatsList.appendChild(item);
            });
            
            // Delete buttons
            chatsList.querySelectorAll('.chat-item__delete').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const convId = btn.dataset.convId;
                    await deleteConversation(convId);
                });
            });
        }
        
        async function loadConversation(convId) {
            try {
                const res = await fetch(`/v1/conversations/${convId}`);
                if (!res.ok) return;
                const data = await res.json();
                currentConversationId = convId;
                chatBox.innerHTML = '';
                revealChat();
                (data.messages || []).forEach(msg => addMessage(msg.content || '', msg.role !== 'user'));
                renderConversationsList();
            } catch (e) {
                // ignore
            }
        }
        
        async function deleteConversation(convId) {
            try {
                await fetch(`/v1/conversations/${convId}`, { method: 'DELETE' });
                if (currentConversationId === convId) {
                    currentConversationId = null;
                    showHero();
                }
                await loadConversations();
            } catch (e) {
                // ignore
            }
        }
        
        async function clearAllConversations() {
            if (!confirm(currentLang === 'ar' ? 'هل أنت متأكد من حذف جميع المحادثات؟' : 'Are you sure you want to delete all conversations?')) {
                return;
            }
            try {
                await fetch('/v1/conversations', { method: 'DELETE' });
                currentConversationId = null;
                showHero();
                await loadConversations();
            } catch (e) {
                // ignore
            }
        }
        
        function startNewChat() {
            currentConversationId = null;
            conversationStarted = false;
            showHero();
            renderConversationsList();
        }
        
        newChatBtn.addEventListener('click', startNewChat);
        clearAllChatsBtn.addEventListener('click', clearAllConversations);
        
        function getCurrentInput() {
            return chatPanel.classList.contains('hidden') ? userInput : userInputChat;
        }
        
        function getCurrentSendBtn() {
            return chatPanel.classList.contains('hidden') ? sendBtn : sendBtnChat;
        }

        function renderAttachments() {
            // Get the appropriate container based on current view
            const inHero = chatPanel.classList.contains('hidden');
            const holder = inHero ? document.getElementById('attachments') : document.getElementById('chatAttachments');
            
            if (!holder) return;
            
            holder.innerHTML = '';
            attachments.forEach((att, idx) => {
                const chip = document.createElement('div');
                chip.className = 'attach-chip';
                chip.innerHTML = `
                    <span class="attach-name">${att.name}</span>
                    <button aria-label="remove" data-idx="${idx}" class="attach-remove">×</button>
                `;
                holder.appendChild(chip);
            });
            holder.classList.toggle('hidden', attachments.length === 0);
            
            // Also update the other holder to keep in sync
            const otherHolder = inHero ? document.getElementById('chatAttachments') : document.getElementById('attachments');
            if (otherHolder) {
                otherHolder.innerHTML = holder.innerHTML;
                otherHolder.classList.toggle('hidden', attachments.length === 0);
            }
        }

        async function loadHistory() {
            // History is now managed through conversations
        }

        async function sendMessage() {
            const activeInput = getCurrentInput();
            const activeBtn = getCurrentSendBtn();
            const text = activeInput.value.trim();
            const contextFromFiles = attachments.map(a => `ملف: ${a.name}\n${a.content}`).join('\n\n');
            const combined = contextFromFiles ? `${text}\n\n${contextFromFiles}` : text;
            if (!combined) return;

            activeInput.value = '';
            
            // Switch to chat view on first message
            if (chatPanel.classList.contains('hidden')) {
                revealChat();
            }
            
            // Show user message with file names only (not content)
            let displayText = text;
            if (attachments.length > 0) {
                const fileNames = attachments.map(a => `📎 ${a.name}`).join('، ');
                displayText = text ? `${text}\n${fileNames}` : fileNames;
            }
            addMessage(displayText, false);
            
            // Clear attachments after sending
            attachments = [];
            renderAttachments();
            activeBtn.disabled = true;
            sendBtn.disabled = true;
            sendBtnChat.disabled = true;

            const aiDiv = addMessage('...', true);
            let fullText = '';

            try {
                const response = await fetch('/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        messages: [{ role: 'user', content: combined }],
                        conversation_id: currentConversationId
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                aiDiv.innerText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.substring(6));
                                if (data.conversation_id) {
                                    currentConversationId = data.conversation_id;
                                    // تحديث قائمة المحادثات فوراً
                                    loadConversations();
                                } else if (data.choices && data.choices[0].delta.content) {
                                    const content = data.choices[0].delta.content || '';
                                    fullText += content;
                                    renderContent(fullText, aiDiv);
                                }
                            } catch (e) {}
                        }
                    }
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (err) {
                renderContent(translations[currentLang].error, aiDiv);
            } finally {
                sendBtn.disabled = false;
                sendBtnChat.disabled = false;
                attachments = [];
                renderAttachments();
                userInputChat.focus();
                await loadConversations();
            }
        }

        sendBtn.onclick = sendMessage;
        sendBtnChat.onclick = sendMessage;
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        userInputChat.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function applyLanguage(lang) {
            const t = translations[lang];
            currentLang = lang;
            document.documentElement.lang = t.lang;
            document.documentElement.dir = t.dir;
            document.body.classList.toggle('dir-ltr', lang === 'en');
            document.body.classList.toggle('dir-rtl', lang === 'ar');
            titleText.textContent = t.title;
            subtitleText.textContent = t.subtitle;
            statusText.textContent = t.status;
            userInput.placeholder = t.placeholder;
            userInputChat.placeholder = t.placeholder;
            sendBtn.setAttribute('title', t.send);
            sendBtn.setAttribute('aria-label', t.send);
            sendBtnChat.setAttribute('title', t.send);
            sendBtnChat.setAttribute('aria-label', t.send);
            langToggle.textContent = t.toggleLabel;
            newChatText.textContent = t.newChat;
            chatsLabel.textContent = t.prevChats;
            renderConversationsList();
        }

        langToggle.addEventListener('click', () => {
            const nextLang = currentLang === 'ar' ? 'en' : 'ar';
            applyLanguage(nextLang);
            userInput.focus();
        });

        uploadBtn.addEventListener('click', () => fileInput.click());
        uploadBtnChat.addEventListener('click', () => fileInput.click());
        
        // Drag and drop functionality
        async function handleFileDrop(files) {
            if (!files.length) return;
            const form = new FormData();
            files.forEach(f => form.append('files', f));
            try {
                const res = await fetch('/v1/upload', { method: 'POST', body: form });
                const data = await res.json();
                const received = data.files || [];
                attachments = attachments.concat(received);
                renderAttachments();
            } catch (err) {
                // ignore upload errors
            }
        }
        
        // Hero input drag and drop
        const heroInput = document.getElementById('heroInputInitial');
        const chatInputBar = document.querySelector('.chat-input-bar');
        
        [heroInput, chatInputBar].forEach(element => {
            if (!element) return;
            
            element.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                element.classList.add('drag-over');
            });
            
            element.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                element.classList.remove('drag-over');
            });
            
            element.addEventListener('drop', async (e) => {
                e.preventDefault();
                e.stopPropagation();
                element.classList.remove('drag-over');
                const files = Array.from(e.dataTransfer.files || []);
                await handleFileDrop(files);
            });
        });
        
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files || []);
            await handleFileDrop(files);
            fileInput.value = '';
        });

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.attach-remove');
            if (!btn) return;
            const idx = Number(btn.dataset.idx);
            attachments.splice(idx, 1);
            renderAttachments();
        });

        applyLanguage('ar');
        userInput.focus();
        loadHistory();
        loadConversations();
    </script>
    </div><!-- end main-wrapper -->
</body>
</html>
